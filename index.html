<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>네이버 뉴스 수집기</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --green: #03C75A;
  --green-dark: #02a84b;
  --green-light: #e8f9f0;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --border: #e4e6ea;
  --text: #191919;
  --text-sub: #555;
  --text-muted: #999;
  --radius: 12px;
  --radius-sm: 8px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; height: 52px;
}
.logo { font-size: 22px; font-weight: 900; color: var(--green); letter-spacing: -1px; }
.logo-sub { font-size: 13px; color: var(--text-muted); }
.search-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 12px;
}
.api-section {
  background: var(--green-light);
  border: 1px solid #c3ecd6;
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex; flex-direction: column; gap: 7px;
}
.api-section-label {
  font-size: 11px; font-weight: 700; color: var(--green-dark);
  text-transform: uppercase; letter-spacing: 0.4px;
  display: flex; align-items: center; gap: 5px;
}
.api-dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; }
.api-dot.active { background: var(--green); }
.api-row { display: flex; align-items: center; gap: 8px; }
.api-row span { font-size: 11px; color: var(--text-sub); min-width: 50px; }
.api-saved-view { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.api-saved-text { font-size: 12px; color: var(--text-sub); display: flex; flex-direction: column; gap: 3px; flex: 1; }
.api-saved-text span { letter-spacing: 1px; }
.api-edit-btn {
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: white;
  font-size: 12px; color: var(--text-sub);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.api-edit-btn:hover { border-color: var(--green); color: var(--green); }
.api-input-view { display: flex; flex-direction: column; gap: 7px; }
.api-save-btn {
  padding: 8px; border-radius: var(--radius-sm);
  background: var(--green); color: white; border: none;
  font-size: 13px; font-weight: 700; cursor: pointer;
}
.api-save-btn:hover { background: var(--green-dark); }
.preset-section { display: flex; flex-direction: column; gap: 6px; }
.preset-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
.preset-list { display: flex; flex-direction: column; gap: 5px; }
.preset-item { display: flex; align-items: center; gap: 6px; }
.preset-input { flex: 1; }
.preset-btn {
  padding: 8px 12px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600; color: var(--text-sub);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.preset-btn:hover { background: var(--green-light); border-color: var(--green); color: var(--green-dark); }
.keyword-wrap { position: relative; }
.keyword-input-row { display: flex; gap: 8px; }
.keyword-input-row input { flex: 1; }
.recent-keywords {
  display: none; position: absolute; top: 100%; left: 0; right: 60px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  z-index: 50; overflow: hidden; margin-top: 4px;
}
.recent-keywords.open { display: block; }
.recent-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; cursor: pointer;
  border-bottom: 1px solid #f5f5f5; gap: 8px;
}
.recent-item:last-child { border-bottom: none; }
.recent-item:hover { background: #f9f9f9; }
.recent-item-text { font-size: 13px; color: var(--text); flex: 1; }
.recent-item-del { font-size: 18px; color: var(--text-muted); line-height: 1; }
.recent-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px 4px; font-size: 11px; color: var(--text-muted);
}
.recent-clear { font-size: 11px; color: var(--text-muted); cursor: pointer; }
.recent-clear:hover { color: var(--text); }
.option-group { display: flex; flex-direction: column; gap: 5px; }
.option-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
.pill-group { display: flex; flex-wrap: wrap; gap: 5px; }
.pill {
  padding: 6px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--surface);
  font-size: 12px; color: var(--text-sub);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.pill:hover { border-color: var(--green); color: var(--green); }
.pill.active { background: var(--green); border-color: var(--green); color: white; font-weight: 700; }
.date-range {
  display: none; flex-direction: column; gap: 6px;
  background: #fafafa; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px; margin-top: 2px;
}
.date-range.open { display: flex; }
.date-range-row { display: flex; align-items: center; gap: 8px; }
.date-range-row span { font-size: 12px; color: var(--text-muted); }
input[type="text"], input[type="date"], input[type="password"] {
  width: 100%; padding: 9px 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; color: var(--text); background: var(--surface);
  outline: none; transition: border 0.15s; -webkit-appearance: none;
}
input:focus { border-color: var(--green); }
input[type="date"] { font-size: 13px; }
.btn {
  padding: 9px 16px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 700; border: none;
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-primary { background: var(--green); color: white; }
.btn-primary:hover { background: var(--green-dark); }
.btn-primary:disabled { background: #ccc; cursor: not-allowed; }
.list-header {
  display: none; align-items: center; justify-content: space-between;
  padding: 8px 16px;
  background: #fafafa; border-bottom: 1px solid var(--border);
  position: sticky; top: 52px; z-index: 90;
}
.list-header.visible { display: flex; }
.list-meta { display: flex; align-items: center; gap: 8px; }
.count-badge { background: var(--green); color: white; font-size: 11px; font-weight: 700; border-radius: 20px; padding: 2px 9px; }
.selected-count { font-size: 12px; color: var(--text-muted); }
.select-all-btn { font-size: 12px; color: var(--green-dark); font-weight: 700; background: none; border: none; cursor: pointer; padding: 4px; }
.article-list { padding-bottom: 80px; }
.article-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid #f0f0f0;
  background: var(--surface); cursor: pointer; transition: background 0.1s;
}
.article-item:active { background: #f5f5f5; }
.article-item.active { background: var(--green-light); border-left: 3px solid var(--green); padding-left: 13px; }
.article-item input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; accent-color: var(--green); cursor: pointer; }
.article-info { flex: 1; min-width: 0; }
.article-title {
  font-size: 14px; font-weight: 500; line-height: 1.5; margin-bottom: 5px;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.article-date { font-size: 11px; color: var(--text-muted); }
.article-arrow { color: var(--text-muted); font-size: 16px; margin-top: 2px; flex-shrink: 0; }
.copy-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 16px; z-index: 100;
}
.btn-copy {
  width: 100%; padding: 13px;
  background: #1a1a1a; color: white;
  border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s;
}
.btn-copy:hover { background: #333; }
.btn-copy:disabled { background: #ccc; cursor: not-allowed; }
.modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.4); }
.modal-overlay.open { display: block; }
.modal {
  position: fixed; bottom: 0; left: 0; right: 0; height: 85vh;
  background: var(--surface); border-radius: 20px 20px 0 0;
  display: none; flex-direction: column; z-index: 201;
}
.modal.open { display: flex; animation: slideUp 0.25s ease-out; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; border-radius: 2px; background: #ddd; margin: 12px auto 8px; flex-shrink: 0; }
.modal-header { padding: 0 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-title { font-size: 15px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
.modal-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.modal-date { font-size: 12px; color: var(--text-muted); }
.modal-open-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 20px;
  background: none; font-size: 12px; color: var(--text-sub);
  cursor: pointer; white-space: nowrap; transition: all 0.15s;
}
.modal-open-btn:hover { border-color: var(--green); color: var(--green); }
.modal-body { flex: 1; overflow: hidden; position: relative; }
.modal-body iframe { width: 100%; height: 100%; border: none; }
.modal-blocked {
  display: none; position: absolute; inset: 0;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; text-align: center; padding: 32px; background: var(--bg);
}
.modal-blocked.show { display: flex; }
.modal-blocked .icon { font-size: 40px; }
.modal-blocked h3 { font-size: 15px; font-weight: 700; }
.modal-blocked p { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
.blocked-url {
  background: white; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 14px; font-size: 11px; color: var(--text-sub);
  word-break: break-all; width: 100%; cursor: pointer;
}
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 60px 32px; text-align: center; color: var(--text-muted);
}
.empty-state .icon { font-size: 48px; }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-sub); }
.empty-state p { font-size: 13px; line-height: 1.6; }
.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
  background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 4px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.error-box { padding: 8px 12px; background: #fff3f3; border: 1px solid #ffcdd2; border-radius: var(--radius-sm); font-size: 12px; color: #c62828; }
.no-results { padding: 48px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: #1a1a1a; color: white;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; opacity: 0; transition: all 0.25s;
  pointer-events: none; z-index: 999; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="header">
  <span class="logo">N</span>
  <span class="logo-sub">뉴스 수집기</span>
</div>

<div class="search-panel">
  <!-- API KEY -->
  <div class="api-section">
    <div class="api-section-label">
      <span class="api-dot" id="apiDot"></span>
      🔑 API 인증
    </div>
    <div class="api-saved-view" id="apiSavedView" style="display:none;">
      <div class="api-saved-text">
        <span>ID &nbsp;●●●●●●●●●●</span>
        <span>Secret &nbsp;●●●●●●●●●●</span>
      </div>
      <button class="api-edit-btn" onclick="showApiInput()">수정</button>
    </div>
    <div class="api-input-view" id="apiInputView">
      <div class="api-row">
        <span>Client ID</span>
        <input type="text" id="clientId" placeholder="Client ID 입력" autocomplete="off">
      </div>
      <div class="api-row">
        <span>Secret</span>
        <input type="text" id="clientSecret" placeholder="Client Secret 입력" autocomplete="off">
      </div>
      <button class="api-save-btn" onclick="saveApiKeys()">저장</button>
    </div>
  </div>

  <!-- 즐겨찾기 키워드 -->
  <div class="preset-section">
    <div class="preset-label">⭐ 즐겨찾기 키워드</div>
    <div class="preset-list">
      <div class="preset-item">
        <input type="text" class="preset-input" id="preset0" placeholder="키워드 1 입력" oninput="savePresets()">
        <button class="preset-btn" onclick="usePreset(0)">검색</button>
      </div>
      <div class="preset-item">
        <input type="text" class="preset-input" id="preset1" placeholder="키워드 2 입력" oninput="savePresets()">
        <button class="preset-btn" onclick="usePreset(1)">검색</button>
      </div>
      <div class="preset-item">
        <input type="text" class="preset-input" id="preset2" placeholder="키워드 3 입력" oninput="savePresets()">
        <button class="preset-btn" onclick="usePreset(2)">검색</button>
      </div>
    </div>
  </div>

  <!-- 키워드 직접 입력 -->
  <div class="keyword-wrap">
    <div class="keyword-input-row">
      <input type="text" id="keyword" placeholder="키워드 직접 검색..."
        autocomplete="off"
        onfocus="showRecent()"
        oninput="showRecent()"
        onkeydown="if(event.key==='Enter'){hideRecent();doSearch();}">
      <button class="btn btn-primary" id="searchBtn" onclick="hideRecent();doSearch()">검색</button>
    </div>
    <div class="recent-keywords" id="recentKeywords">
      <div class="recent-header">
        <span>최근 검색</span>
        <span class="recent-clear" onclick="clearRecent()">전체 삭제</span>
      </div>
      <div id="recentList"></div>
    </div>
  </div>

  <!-- 정렬 -->
  <div class="option-group">
    <div class="option-label">정렬</div>
    <div class="pill-group" id="sortGroup">
      <button class="pill" data-val="date" onclick="selectSort(this)">최신순</button>
      <button class="pill" data-val="sim" onclick="selectSort(this)">관련도순</button>
    </div>
  </div>

  <!-- 기간 -->
  <div class="option-group">
    <div class="option-label">기간</div>
    <div class="pill-group" id="periodGroup">
      <button class="pill" data-val="all" onclick="selectPeriod(this)">전체</button>
      <button class="pill" data-val="1h" onclick="selectPeriod(this)">1시간</button>
      <button class="pill" data-val="1d" onclick="selectPeriod(this)">1일</button>
      <button class="pill" data-val="1w" onclick="selectPeriod(this)">1주</button>
      <button class="pill" data-val="1m" onclick="selectPeriod(this)">1개월</button>
      <button class="pill" data-val="3m" onclick="selectPeriod(this)">3개월</button>
      <button class="pill" data-val="6m" onclick="selectPeriod(this)">6개월</button>
      <button class="pill" data-val="1y" onclick="selectPeriod(this)">1년</button>
      <button class="pill" data-val="custom" onclick="selectPeriod(this)">직접입력</button>
    </div>
    <div class="date-range" id="dateRange">
      <div class="date-range-row">
        <input type="date" id="startDate">
        <span>~</span>
        <input type="date" id="endDate">
      </div>
    </div>
  </div>

  <div id="errorMsg" class="error-box" style="display:none;"></div>
</div>

<div class="list-header" id="listHeader">
  <div class="list-meta">
    <span class="count-badge" id="articleCount">0</span>
    <span class="selected-count" id="selectedCount">0개 선택</span>
  </div>
  <button class="select-all-btn" onclick="toggleSelectAll()">전체선택</button>
</div>

<div class="article-list" id="articleList">
  <div class="empty-state">
    <div class="icon">📰</div>
    <h3>뉴스를 검색해보세요</h3>
    <p>즐겨찾기 키워드를 등록하거나<br>직접 검색어를 입력해주세요.</p>
  </div>
</div>

<div class="copy-bar">
  <button class="btn-copy" id="copyBtn" onclick="copyUrls()" disabled>선택한 기사 URL 복사 (0개)</button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-handle"></div>
  <div class="modal-header">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-meta">
      <span class="modal-date" id="modalDate"></span>
      <button class="modal-open-btn" id="modalOpenBtn">🔗 새 탭으로 열기</button>
    </div>
  </div>
  <div class="modal-body">
    <iframe id="articleFrame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups" title="기사 본문"></iframe>
    <div class="modal-blocked" id="modalBlocked">
      <div class="icon">🔒</div>
      <h3>미리보기가 차단되었습니다</h3>
      <p>이 언론사는 보안 정책으로<br>직접 표시가 불가능해요.</p>
      <div class="blocked-url" id="blockedUrl" onclick="openCurrent()"></div>
      <button class="btn btn-primary" onclick="openCurrent()" style="width:100%;margin-top:4px;">새 탭으로 열기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let articles = [];
let selectedIds = new Set();
let activeId = null;
let currentArticleUrl = '';
let sortVal = 'date';
let periodVal = '1d';

(function init() {
  const id = localStorage.getItem('naver_client_id') || '';
  const secret = localStorage.getItem('naver_client_secret') || '';
  if (id && secret) {
    document.getElementById('apiSavedView').style.display = 'flex';
    document.getElementById('apiInputView').style.display = 'none';
    document.getElementById('apiDot').classList.add('active');
  } else {
    document.getElementById('apiSavedView').style.display = 'none';
    document.getElementById('apiInputView').style.display = 'flex';
  }

  const presets = JSON.parse(localStorage.getItem('naver_presets') || '["","",""]');
  presets.forEach((p, i) => { const el = document.getElementById(`preset${i}`); if (el) el.value = p; });

  sortVal = localStorage.getItem('naver_sort') || 'date';
  document.querySelectorAll('#sortGroup .pill').forEach(p => { if (p.dataset.val === sortVal) p.classList.add('active'); });

  periodVal = localStorage.getItem('naver_period') || '1d';
  document.querySelectorAll('#periodGroup .pill').forEach(p => { if (p.dataset.val === periodVal) p.classList.add('active'); });
  if (periodVal === 'custom') document.getElementById('dateRange').classList.add('open');

  const today = new Date().toISOString().split('T')[0];
  document.getElementById('endDate').value = localStorage.getItem('naver_end') || today;
  document.getElementById('startDate').value = localStorage.getItem('naver_start') || today;
})();

function saveApiKeys() {
  const id = document.getElementById('clientId').value.trim();
  const secret = document.getElementById('clientSecret').value.trim();
  if (!id || !secret) { showToast('ID와 Secret을 모두 입력해주세요.'); return; }
  localStorage.setItem('naver_client_id', id);
  localStorage.setItem('naver_client_secret', secret);
  document.getElementById('apiDot').classList.add('active');
  document.getElementById('apiInputView').style.display = 'none';
  document.getElementById('apiSavedView').style.display = 'flex';
  showToast('✅ API 키가 저장되었습니다.');
}
function showApiInput() {
  document.getElementById('apiSavedView').style.display = 'none';
  document.getElementById('apiInputView').style.display = 'flex';
}

function savePresets() {
  const presets = [0,1,2].map(i => document.getElementById(`preset${i}`).value);
  localStorage.setItem('naver_presets', JSON.stringify(presets));
}
function usePreset(i) {
  const val = document.getElementById(`preset${i}`).value.trim();
  if (!val) { showToast('키워드를 먼저 입력해주세요.'); return; }
  document.getElementById('keyword').value = val;
  hideRecent(); doSearch();
}

function getRecent() { return JSON.parse(localStorage.getItem('naver_recent') || '[]'); }
function saveRecent(kw) {
  let list = getRecent().filter(k => k !== kw);
  list.unshift(kw);
  localStorage.setItem('naver_recent', JSON.stringify(list.slice(0, 5)));
}
function deleteRecent(kw, e) {
  e.stopPropagation();
  localStorage.setItem('naver_recent', JSON.stringify(getRecent().filter(k => k !== kw)));
  showRecent();
}
function clearRecent() { localStorage.removeItem('naver_recent'); hideRecent(); }
function showRecent() {
  const kw = document.getElementById('keyword').value.trim();
  const filtered = getRecent().filter(k => !kw || k.includes(kw));
  if (!filtered.length) { hideRecent(); return; }
  document.getElementById('recentList').innerHTML = filtered.map(k => `
    <div class="recent-item" onclick="pickRecent('${k.replace(/'/g,"\\'")}')">
      <span class="recent-item-text">🕐 ${k}</span>
      <span class="recent-item-del" onclick="deleteRecent('${k.replace(/'/g,"\\'")}',event)">×</span>
    </div>`).join('');
  document.getElementById('recentKeywords').classList.add('open');
}
function hideRecent() { document.getElementById('recentKeywords').classList.remove('open'); }
function pickRecent(kw) { document.getElementById('keyword').value = kw; hideRecent(); doSearch(); }
document.addEventListener('click', e => { if (!e.target.closest('.keyword-wrap')) hideRecent(); });

function selectSort(el) {
  document.querySelectorAll('#sortGroup .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active'); sortVal = el.dataset.val;
  localStorage.setItem('naver_sort', sortVal);
}
function selectPeriod(el) {
  document.querySelectorAll('#periodGroup .pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active'); periodVal = el.dataset.val;
  localStorage.setItem('naver_period', periodVal);
  document.getElementById('dateRange').classList.toggle('open', periodVal === 'custom');
}

function getDateRange() {
  if (periodVal === 'all') return { start: null, end: null };
  if (periodVal === 'custom') {
    const s = document.getElementById('startDate').value;
    const e = document.getElementById('endDate').value;
    localStorage.setItem('naver_start', s); localStorage.setItem('naver_end', e);
    return { start: s || null, end: e || null };
  }
  const map = { '1h': 1/24, '1d': 1, '1w': 7, '1m': 30, '3m': 90, '6m': 180, '1y': 365 };
  const now = new Date();
  return { start: new Date(now - (map[periodVal]||1)*86400000).toISOString().split('T')[0], end: now.toISOString().split('T')[0] };
}
function isInRange(pubDate, start, end) {
  const d = new Date(pubDate);
  if (start && d < new Date(start)) return false;
  if (end && d > new Date(end+'T23:59:59')) return false;
  return true;
}
function stripHtml(html) {
  return html.replace(/<[^>]*>/g,'').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#\d+;/g,'');
}
function formatDate(pubDate) {
  try {
    const d = new Date(pubDate);
    return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  } catch { return ''; }
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}

async function doSearch() {
  const clientId = localStorage.getItem('naver_client_id') || '';
  const clientSecret = localStorage.getItem('naver_client_secret') || '';
  const keyword = document.getElementById('keyword').value.trim();

  showError('');
  if (!clientId || !clientSecret) { showApiInput(); return showError('Client ID와 Secret을 먼저 저장해주세요.'); }
  if (!keyword) return showError('키워드를 입력해주세요.');

  saveRecent(keyword);
  const btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = '검색 중...';
  selectedIds.clear(); activeId = null; articles = [];
  updateCountUI();

  document.getElementById('articleList').innerHTML = `
    <div style="background:white;">
      ${Array(7).fill(`
        <div style="display:flex;gap:10px;padding:13px 16px;border-bottom:1px solid #f0f0f0;">
          <div class="skeleton" style="width:18px;height:18px;flex-shrink:0;border-radius:3px;margin-top:2px;"></div>
          <div style="flex:1;">
            <div class="skeleton" style="height:40px;margin-bottom:8px;"></div>
            <div class="skeleton" style="height:12px;width:40%;"></div>
          </div>
        </div>`).join('')}
    </div>`;
  document.getElementById('listHeader').classList.remove('visible');

  try {
    const params = new URLSearchParams({ query: keyword, display: 100, start: 1, sort: sortVal });
    const res = await fetch(`https://openapi.naver.com/v1/search/news.json?${params}`, {
      headers: {
        'X-Naver-Client-Id': clientId,
        'X-Naver-Client-Secret': clientSecret
      }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.errorMessage || `오류 ${res.status}`);
    }
    const data = await res.json();
    const { start, end } = getDateRange();
    articles = (data.items || [])
      .filter(item => isInRange(item.pubDate, start, end))
      .map((item, i) => ({
        id: i,
        title: stripHtml(item.title),
        link: item.originallink || item.link,
        date: formatDate(item.pubDate),
      }));
    renderList();
  } catch(e) {
    showError(e.message || '검색 중 오류가 발생했습니다.');
    document.getElementById('articleList').innerHTML = `<div class="no-results">결과를 불러오지 못했습니다.</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '검색';
  }
}

function renderList() {
  const list = document.getElementById('articleList');
  const header = document.getElementById('listHeader');
  if (!articles.length) {
    list.innerHTML = `<div class="no-results">해당 기간에 기사가 없습니다.</div>`;
    header.classList.remove('visible'); return;
  }
  header.classList.add('visible');
  document.getElementById('articleCount').textContent = articles.length;
  updateCountUI();
  list.innerHTML = `<div style="background:white;">` + articles.map(a => `
    <div class="article-item ${a.id === activeId ? 'active' : ''}" id="item-${a.id}" onclick="openModal(${a.id})">
      <input type="checkbox" ${selectedIds.has(a.id) ? 'checked' : ''} onclick="event.stopPropagation();toggleCheck(${a.id})">
      <div class="article-info">
        <div class="article-title">${a.title}</div>
        <div class="article-date">${a.date}</div>
      </div>
      <span class="article-arrow">›</span>
    </div>`).join('') + `</div>`;
}

function toggleCheck(id) {
  if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  updateCountUI();
}
function updateCountUI() {
  const n = selectedIds.size;
  document.getElementById('selectedCount').textContent = `${n}개 선택`;
  const btn = document.getElementById('copyBtn');
  btn.disabled = n === 0;
  btn.textContent = `선택한 기사 URL 복사 (${n}개)`;
}
function toggleSelectAll() {
  if (selectedIds.size === articles.length) selectedIds.clear();
  else articles.forEach(a => selectedIds.add(a.id));
  renderList();
}

function openModal(id) {
  activeId = id;
  document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`item-${id}`)?.classList.add('active');
  const a = articles[id];
  currentArticleUrl = a.link;
  document.getElementById('modalTitle').textContent = a.title;
  document.getElementById('modalDate').textContent = a.date;
  document.getElementById('modalOpenBtn').onclick = () => window.open(a.link, '_blank');
  document.getElementById('blockedUrl').textContent = a.link;
  document.getElementById('articleFrame').src = a.link;
  document.getElementById('articleFrame').style.display = 'block';
  document.getElementById('modalBlocked').classList.remove('show');
  document.getElementById('modal').classList.add('open');
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => {
    try {
      const frame = document.getElementById('articleFrame');
      const doc = frame.contentDocument || frame.contentWindow?.document;
      if (!doc || !doc.body || doc.body.innerHTML.trim() === '') showBlocked();
    } catch { showBlocked(); }
  }, 2000);
}
function showBlocked() {
  document.getElementById('modalBlocked').classList.add('show');
  document.getElementById('articleFrame').style.display = 'none';
}
function openCurrent() { window.open(currentArticleUrl, '_blank'); }
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('articleFrame').src = '';
}

function copyUrls() {
  if (!selectedIds.size) return;
  const urls = [...selectedIds].map(id => articles[id].link).join('\n');
  navigator.clipboard.writeText(urls)
    .then(() => showToast(`✅ ${selectedIds.size}개 URL 복사 완료!`))
    .catch(() => {
      const ta = document.createElement('textarea');
      ta.value = urls; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast(`✅ ${selectedIds.size}개 URL 복사 완료!`);
    });
}
</script>
</body>
</html>
